<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>عناية الخبراء لخدمات السيارات — Website concept by ZY Flow</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800;900&family=IBM+Plex+Sans+Arabic:wght@400;500&family=Manrope:wght@400;600&family=Reem+Kufi:wght@600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
:root{--bg:#08090a;--ln:rgba(255,255,255,.14);--sv:#b9c0ca;--wh:#f2f4f7;--am:#d9a441;--fd:'Big Shoulders Display','Arial Narrow',Impact,sans-serif;--fb:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[dir=rtl]{--fd:'Reem Kufi','Segoe UI',Tahoma,sans-serif;--fb:'IBM Plex Sans Arabic','Segoe UI',Tahoma,sans-serif}
[dir=rtl] *{letter-spacing:0!important}
html{scroll-behavior:smooth;scroll-padding-top:calc(env(safe-area-inset-top,0px) + 72px)}
body{background:var(--bg);color:var(--wh);font:400 1rem/1.6 var(--fb);overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:rgba(8,9,10,.92);z-index:60}
a{color:inherit}
:focus-visible{outline:2px solid var(--am);outline-offset:3px}
nav{position:fixed;top:0;inset-inline:0;z-index:50;display:flex;align-items:center;gap:1.4rem;padding:calc(env(safe-area-inset-top,0px) + 14px) clamp(16px,4vw,56px) 14px;background:linear-gradient(rgba(8,9,10,.92),rgba(8,9,10,0))}
.br{margin-inline-end:auto;font:700 1.2rem/1.2 var(--fd);text-decoration:none;white-space:nowrap}
.l{color:var(--sv);text-decoration:none;font-size:.92rem;position:relative}
.l::after{content:"";position:absolute;inset:auto 0 -5px;height:1px;background:var(--am);transform:scaleX(0);transition:transform .4s}
.l:hover::after{transform:scaleX(1)}
.btn{display:inline-flex;align-items:center;justify-content:center;padding:.95rem 1.7rem;border:1px solid var(--ln);border-radius:999px;background:rgba(255,255,255,.05);backdrop-filter:blur(8px);color:var(--wh);font:600 .95rem/1 var(--fb);text-decoration:none;cursor:pointer;transition:background .3s,border-color .3s,transform .25s ease-out}
.btn:hover{border-color:var(--sv);background:rgba(255,255,255,.1)}
.pri{background:var(--am);border-color:var(--am);color:#17110a}
.pri:hover{background:#e6b556;border-color:#e6b556}
.sm{padding:.6rem 1.1rem;font-size:.85rem}
/* hero */
.hero{position:relative;min-height:100svh;display:flex;flex-direction:column;justify-content:flex-end;padding:calc(env(safe-area-inset-top,0px) + 110px) clamp(16px,4vw,56px) 56px;overflow:hidden;isolation:isolate;background:radial-gradient(120% 90% at 72% 8%,#1c2027 0,var(--bg) 62%)}
.hero::before{content:"";position:absolute;inset:0;z-index:0;pointer-events:none;background:linear-gradient(90deg,rgba(8,9,10,.88),rgba(8,9,10,0) 64%)}
[dir=rtl] .hero::before{transform:scaleX(-1)}
.hero::after{content:"";position:absolute;inset:auto 0 0;height:140px;z-index:0;pointer-events:none;background:linear-gradient(transparent,var(--bg))}
#fx{position:absolute;inset:0;width:100%;height:100%;z-index:-1}
.hw{position:relative;z-index:3;max-width:1100px;translate:0 calc(var(--sy,0)*-.1px)}
h1{display:flex;flex-direction:column;font:900 clamp(3.4rem,12.5vw,11.5rem)/.86 var(--fd);text-transform:uppercase;padding-bottom:.04em}
h1 span{display:block;overflow:hidden;translate:calc(var(--px,0)*var(--k,1)*1px) 0}
h1 i{display:block;font-style:normal;padding-top:.06em;background:linear-gradient(180deg,#fff 5%,#aab2bf 58%,#5e6672);-webkit-background-clip:text;background-clip:text;color:transparent;animation:up 1.3s cubic-bezier(.2,.8,.2,1) both}
h1 span+span{--k:1.9}
h1 span+span i{animation-delay:.18s}
[dir=rtl] h1{line-height:1.2;font-size:clamp(3rem,10vw,9rem)}
@keyframes up{from{transform:translateY(108%)}}
@keyframes fi{from{opacity:0}}
.lead{max-width:46ch;margin-top:1.6rem;color:var(--sv);font-size:clamp(1rem,1.5vw,1.2rem)}
.cta{display:flex;flex-wrap:wrap;gap:.8rem;margin-top:2rem}
.hw>:not(h1){animation:fi 1s .9s both}
.rt{display:flex;flex-wrap:wrap;align-items:center;gap:.6rem 1.4rem;margin-top:2.2rem;color:var(--sv);font-size:.95rem}
.rt>span:nth-child(n+3){padding-inline-start:1.4rem;border-inline-start:1px solid var(--ln)}
.rt b{color:var(--wh);font-size:1.15rem}
.stars{background:linear-gradient(to right,var(--am) 92%,#3a3f47 92%);-webkit-background-clip:text;background-clip:text;color:transparent;font-size:1.2rem;letter-spacing:.08em}
.stage{position:absolute;z-index:1;inset-inline-end:clamp(16px,5vw,80px);top:calc(env(safe-area-inset-top,0px) + 120px);width:min(46vw,470px);aspect-ratio:4/3.4;perspective:1000px;translate:0 calc(var(--sy,0)*.06px);animation:fi 1.6s .5s both}
.t3{position:absolute;inset:0;transform-style:preserve-3d;transform:rotateY(calc(var(--rx,0)*12deg)) rotateX(calc(var(--ry,0)*-9deg));transition:transform .25s ease-out}
.ph{position:absolute;margin:0;overflow:hidden;border:1px solid rgba(255,255,255,.22);border-radius:6px;background:#000;box-shadow:0 40px 80px -20px #000}
.ph img{display:block;width:100%;height:100%;object-fit:cover}
.ph::after{content:"";position:absolute;inset:0;pointer-events:none;mix-blend-mode:overlay;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.3) 50%,transparent 65%) calc(var(--rx,0)*-60% - 40%) 0/220% 100%}
.pa{inset-block:0 14%;inset-inline:8% 0}
.pb{width:36%;aspect-ratio:3/4;inset-inline-start:0;bottom:0;transform:translateZ(70px)}
/* sections */
section{padding:clamp(72px,12vw,150px) clamp(16px,4vw,56px)}
h2{font:800 clamp(2.4rem,7vw,6rem)/.95 var(--fd);text-transform:uppercase}
[dir=rtl] h2{line-height:1.25}
.sh{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:1rem 2rem;margin-bottom:2.5rem}
.sh p{max-width:30ch;color:var(--sv)}
ul{list-style:none;padding:0}
li:last-child{border-bottom:1px solid var(--ln)}
.row{display:flex;align-items:center;gap:1rem;width:100%;padding:1.1rem 0;border:0;border-top:1px solid var(--ln);background:none;color:inherit;font:inherit;text-align:start;cursor:pointer}
.row b{display:inline-block;font:800 clamp(1.7rem,4.2vw,3.4rem)/1.1 var(--fd);transition:transform .5s cubic-bezier(.2,.8,.2,1),color .3s,background-position .9s}
.row[data-v="0"] b{background:linear-gradient(100deg,var(--sv) 40%,#fff 50%,var(--sv) 60%) 100% 0/250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent}
.row[data-v="0"]:hover b,.row[data-v="0"][aria-expanded=true] b{background-position:0 0}
.row[data-v="1"]:hover b{transform:translateX(18px)}
[dir=rtl] .row[data-v="1"]:hover b{transform:translateX(-18px)}
.row[data-v="2"]:hover b,.row[aria-expanded=true] b{color:var(--am)}
.row[data-v="2"] b{letter-spacing:0;transition-property:letter-spacing,color}
.row[data-v="2"]:hover b{letter-spacing:.06em}
.pl{position:relative;flex:none;width:22px;height:22px;margin-inline-start:auto}
.pl::before,.pl::after{content:"";position:absolute;inset:50% 0 auto;height:1px;background:var(--sv);transition:transform .4s}
.pl::after{transform:rotate(90deg)}
.row[aria-expanded=true] .pl::after{transform:none}
.pn{display:grid;grid-template-rows:0fr;transition:grid-template-rows .55s cubic-bezier(.2,.8,.2,1)}
.pn>div{min-height:0;overflow:hidden;visibility:hidden;transition:visibility 0s .55s}
.row[aria-expanded=true]+.pn{grid-template-rows:1fr}
.row[aria-expanded=true]+.pn>div{visibility:visible;transition-delay:0s}
.in{max-width:880px;padding:.3rem 0 1.8rem}
.d0{max-width:60ch;margin-bottom:1.2rem;color:var(--wh);font-size:1.1rem}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:1.2rem 2rem;margin-bottom:1.2rem}
h4{margin-bottom:.3rem;color:var(--am);font:600 .8rem/1.4 var(--fb)}
.g p{color:var(--sv)}
.in small{display:block;margin-bottom:1.2rem;color:#8a929d}
.tel{display:none}
@media(hover:none) and (pointer:coarse){.tel{display:inline-flex}}
.ac{display:flex;flex-wrap:wrap;gap:.6rem}
/* inquiry + contact */
.cols{display:grid;grid-template-columns:1.05fr .95fr;gap:clamp(28px,6vw,90px);align-items:start;border-top:1px solid var(--ln)}
.tag{display:inline-block;margin:1.2rem 0 .8rem;padding:.25rem .8rem;border:1px solid var(--am);border-radius:99px;color:var(--am);font-size:.8rem}
.dm{max-width:52ch;margin-bottom:1.8rem;color:var(--sv)}
label{display:block;margin-bottom:1.1rem;color:var(--sv);font-size:.85rem}
input,select,textarea{display:block;width:100%;margin-top:.35rem;padding:.8rem .9rem;border:1px solid var(--ln);border-radius:6px;background:#0e1013;color:var(--wh);font:inherit;font-size:1rem}
#st{min-height:3.2em;margin-top:1rem;color:var(--am)}
.cd{padding:clamp(18px,3vw,32px);border:1px solid var(--ln);border-radius:12px;background:linear-gradient(160deg,#181b21,#0b0c0e)}
h3{font:700 clamp(1.5rem,3vw,2.1rem)/1.2 var(--fd)}
.rt2{display:flex;align-items:center;gap:.6rem;margin-top:.5rem;color:var(--sv)}
.rt2 b{color:var(--wh)}
dl{display:grid;grid-template-columns:auto 1fr;gap:.7rem 1.4rem;margin:1.4rem 0}
dt{color:var(--sv);font-size:.85rem}
dd{margin:0}
dd small{display:block;color:#8a929d}
.ac2{display:flex;flex-wrap:wrap;gap:.6rem}
footer{padding:2rem clamp(16px,4vw,56px) 3rem;border-top:1px solid var(--ln);color:#8a929d;font-size:.8rem}
#ts{position:fixed;inset-inline:0;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);z-index:90;width:max-content;max-width:90vw;margin-inline:auto;padding:.6rem 1.1rem;border-radius:99px;background:#eef1f5;color:#111;font-size:.9rem;opacity:0;transform:translateY(10px);transition:.3s;pointer-events:none}
#ts.on{opacity:1;transform:none}
#cu{position:fixed;left:0;top:0;width:34px;height:34px;margin:-17px 0 0 -17px;z-index:100;border:1px solid rgba(255,255,255,.75);border-radius:50%;mix-blend-mode:difference;pointer-events:none;opacity:0;transition:width .25s,height .25s,margin .25s,background .25s,opacity .3s}
#cu.hv{width:58px;height:58px;margin:-29px 0 0 -29px;background:#fff}
.js [data-r]{clip-path:inset(0 0 100% 0);transition:clip-path 1.1s cubic-bezier(.7,0,.2,1)}
.js [data-r].in{clip-path:inset(-40% -10%)}
@media(max-width:860px){
.stage{position:relative;inset:auto;width:min(88vw,420px);margin-top:36px;translate:none}
.hero{justify-content:flex-start}
.cols{grid-template-columns:1fr}}
@media(max-width:560px){.l,.nc{display:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>

  st.vx+=(30*(st.tx-st.lx)-11*st.vx)*dt;st.vy+=(30*(st.ty-st.ly)-11*st.vy)*dt;st.lx+=st.vx*dt;st.ly+=st.vy*dt;
  render();raf=requestAnimationFrame(frame)};
 const go=()=>{if(!raf&&vis&&!RM)raf=requestAnimationFrame(frame)};
 if(!RM)addEventListener('pointermove',e=>{const b=box.getBoundingClientRect(),x=e.clientX-b.left,y=e.clientY-b.top;
  const inside=x>=0&&y>=0&&x<=b.width&&y<=b.height;st.tx=inside?(x/b.width-.5)*.5:0;st.ty=inside?(.5-y/b.height)*.5:0},{passive:true});
 new ResizeObserver(render).observe(box);
 new IntersectionObserver(es=>{vis=es.some(e=>e.isIntersecting);if(vis){last=0;go()}}).observe(box);
 document.addEventListener('visibilitychange',()=>{last=0;go()});
 render();go();
}
try{fibers(hero,$('#fx'))}catch(err){console.warn('GhostFibers unavailable',err)}
})();
